{% extends 'hospital/homebase.html' %}

{% block content %}

<style>
  .admin-hero {
    background: linear-gradient(135deg, #a53737, #8d3d3d);
    color: white;
    border-radius: 15px;
    padding: 50px 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  }

  .admin-hero h1 {
    font-weight: 700;
  }

  .admin-hero p {
    font-size: 1.1rem;
  }

  .admin-btn {
    min-width: 160px;
    border-radius: 30px;
    font-weight: 600;
    padding: 12px 20px;
  }
</style>

<br><br>

<div class="container">
  <div class="admin-hero text-center">
    <h1 class="display-5">Hello, Admin 👨‍⚕️</h1>
    <p class="mt-3">
      Welcome to the <strong>Hospital Management System</strong><br>
      Manage doctors, patients, appointments, and hospital activities with ease.
    </p>

    <hr class="bg-light my-4">

    <p>You can access all administrative features after login.</p>

    <div class="mt-4">
      <a class="btn btn-light btn-lg admin-btn me-2" href="/adminsignup">
        <i class="fas fa-user-plus"></i> Sign Up
      </a>
      <a class="btn btn-outline-light btn-lg admin-btn" href="/adminlogin">
        <i class="fas fa-sign-in-alt"></i> Login
      </a>
    </div>
  </div>
</div>

<br><br>

{% endblock content %}
