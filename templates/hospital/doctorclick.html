{% extends 'hospital/homebase.html' %}

{% block content %}

<style>
  .doctor-hero {
    background: linear-gradient(135deg, #198754, #157347);
    color: white;
    border-radius: 15px;
    padding: 50px 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  }

  .doctor-hero h1 {
    font-weight: 700;
  }

  .doctor-hero p {
    font-size: 1.1rem;
  }

  .doctor-btn {
    min-width: 160px;
    border-radius: 30px;
    font-weight: 600;
    padding: 12px 20px;
  }
</style>

<br><br>

<div class="container">
  <div class="doctor-hero text-center">
    <h1 class="display-5">Hello, Doctor 👨‍⚕️</h1>
    <p class="mt-3">
      Welcome to the <strong>Hospital Management System</strong><br>
      Manage appointments, view patients, and track schedules efficiently.
    </p>

    <hr class="bg-light my-4">

    <p>You can access all doctor features after login.</p>

    <div class="mt-4">
      <a class="btn btn-light btn-lg doctor-btn me-2" href="/doctorsignup">
        <i class="fas fa-file-medical"></i> Apply
      </a>
      <a class="btn btn-outline-light btn-lg doctor-btn" href="/doctorlogin">
        <i class="fas fa-sign-in-alt"></i> Login
      </a>
    </div>
  </div>
</div>

<br><br>

{% endblock content %}
