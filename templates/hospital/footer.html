<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    footer {
      background: linear-gradient(135deg, #bed0d8, #b8def1);
      padding: 30px 0;
      text-align: center;
      box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.08);
    }

    .footer-title {
      font-size: 18px;
      color: #0d6efd;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .footer-desc {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    .fa {
      padding: 16px;
      font-size: 20px;
      width: 50px;
      height: 50px;
      line-height: 18px;
      text-align: center;
      text-decoration: none;
      margin: 8px;
      border-radius: 50%;
      transition: all 0.3s ease;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
    }

    .fa:hover {
      transform: translateY(-6px) scale(1.05);
      opacity: 0.9;
    }

    .fa-facebook { background: #3b5998; color: #fff; }
    .fa-whatsapp { background: #25d366; color: #fff; }
    .fa-instagram { background: #e1306c; color: #fff; }
    .fa-twitter { background: #1da1f2; color: #fff; }

    .footer-bottom {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<footer>

  <div class="footer-title">🏥 Hospital Management System</div>
  <div class="footer-desc">
    Caring for your health with trust, technology, and compassion.
  </div>

  <div>
    <a href="https://facebook.com/" class="fa fa-facebook"></a>
    <a href="https://api.whatsapp.com/" class="fa fa-whatsapp"></a>
    <a href="https://instagram.com/" class="fa fa-instagram"></a>
    <a href="https://twitter.com/" class="fa fa-twitter"></a>
  </div>

</footer>
</html>
